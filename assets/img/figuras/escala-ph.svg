<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200">
  <text x="180" y="18" text-anchor="middle" class="fig-titulo">La escala de pH: de 0 a 14</text>

  <text x="70" y="52" text-anchor="middle" class="fig-mal-txt" font-size="13">Acido</text>
  <text x="180" y="52" text-anchor="middle" class="fig-destac-txt" font-size="13">Neutro</text>
  <text x="290" y="52" text-anchor="middle" class="fig-ok-txt" font-size="13">Basico</text>

  <rect x="14" y="60" width="112" height="34" class="fig-mal"/>
  <rect x="126" y="60" width="108" height="34" class="fig-destac"/>
  <rect x="234" y="60" width="112" height="34" class="fig-ok"/>

  <text x="14" y="114" text-anchor="middle" class="fig-nota" font-size="10">0</text>
  <text x="38" y="114" text-anchor="middle" class="fig-nota" font-size="10">1</text>
  <text x="61" y="114" text-anchor="middle" class="fig-nota" font-size="10">2</text>
  <text x="85" y="114" text-anchor="middle" class="fig-nota" font-size="10">3</text>
  <text x="109" y="114" text-anchor="middle" class="fig-nota" font-size="10">4</text>
  <text x="133" y="114" text-anchor="middle" class="fig-nota" font-size="10">5</text>
  <text x="156" y="114" text-anchor="middle" class="fig-nota" font-size="10">6</text>
  <text x="180" y="114" text-anchor="middle" class="fig-destac-txt" font-size="11">7</text>
  <text x="204" y="114" text-anchor="middle" class="fig-nota" font-size="10">8</text>
  <text x="227" y="114" text-anchor="middle" class="fig-nota" font-size="10">9</text>
  <text x="251" y="114" text-anchor="middle" class="fig-nota" font-size="10">10</text>
  <text x="275" y="114" text-anchor="middle" class="fig-nota" font-size="10">11</text>
  <text x="299" y="114" text-anchor="middle" class="fig-nota" font-size="10">12</text>
  <text x="322" y="114" text-anchor="middle" class="fig-nota" font-size="10">13</text>
  <text x="346" y="114" text-anchor="middle" class="fig-nota" font-size="10">14</text>

  <text x="180" y="140" text-anchor="middle" class="fig-nota" font-size="12">7 es el punto neutro; por debajo acido y por encima basico.</text>
  <text x="180" y="162" text-anchor="middle" class="fig-nota" font-size="12">Cada unidad de pH es diez veces mas acida que la anterior.</text>
</svg>
