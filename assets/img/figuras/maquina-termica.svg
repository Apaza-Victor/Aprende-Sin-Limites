<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <text x="180" y="18" text-anchor="middle" class="fig-titulo">Maquina termica: el calor tambien se ordena</text>

  <rect x="20" y="34" width="96" height="66" rx="10" class="fig-zona"/>
  <text x="68" y="58" text-anchor="middle" class="fig-sub">Fuente caliente</text>
  <text x="68" y="78" text-anchor="middle" class="fig-dato">Qh</text>
  <line x1="34" y1="92" x2="34" y2="86" class="fig-flecha"/>
  <line x1="52" y1="92" x2="52" y2="86" class="fig-flecha"/>
  <line x1="70" y1="92" x2="70" y2="86" class="fig-flecha"/>
  <line x1="88" y1="92" x2="88" y2="86" class="fig-flecha"/>

  <rect x="150" y="34" width="96" height="66" rx="10" class="fig-ok"/>
  <text x="198" y="58" text-anchor="middle" class="fig-sub">Motor</text>
  <text x="198" y="78" text-anchor="middle" class="fig-ok-txt">trabajo W</text>
  <line x1="198" y1="100" x2="198" y2="176" class="fig-flecha-ok" marker-end="url(#punta-ok)"/>
  <text x="208" y="140" class="fig-ok-txt" font-size="11">W sale</text>

  <defs>
    <marker id="punta-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="150" y="180" width="96" height="52" rx="10" class="fig-destac"/>
  <text x="198" y="202" text-anchor="middle" class="fig-sub">Sumidero frio</text>
  <text x="198" y="222" text-anchor="middle" class="fig-destac-txt">Qc</text>

  <line x1="116" y1="60" x2="148" y2="60" class="fig-flecha"/>
  <text x="132" y="48" text-anchor="middle" class="fig-apoyo-txt" font-size="11">Qh</text>
  <line x1="148" y1="200" x2="118" y2="200" class="fig-flecha"/>
  <text x="132" y="190" text-anchor="middle" class="fig-nota" font-size="11">Qc</text>

  <rect x="268" y="34" width="76" height="198" rx="10" class="fig-forma"/>
  <text x="306" y="58" text-anchor="middle" class="fig-sub">Rendimiento</text>
  <text x="306" y="88" text-anchor="middle" class="fig-ok-txt" font-size="13">W</text>
  <line x1="288" y1="98" x2="324" y2="98" class="fig-medida"/>
  <text x="306" y="120" text-anchor="middle" class="fig-destac-txt" font-size="13">Qh - Qc</text>
  <text x="306" y="150" text-anchor="middle" class="fig-nota" font-size="11">siempre menor</text>
  <text x="306" y="168" text-anchor="middle" class="fig-nota" font-size="11">que 1</text>
  <text x="306" y="196" text-anchor="middle" class="fig-mal-txt" font-size="11">Qh = Qc:</text>
  <text x="306" y="212" text-anchor="middle" class="fig-mal-txt" font-size="11">rendimiento 0</text>
