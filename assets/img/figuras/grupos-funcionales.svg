  <text x="245" y="199" text-anchor="middle" class="fig-ok-txt" font-size="12">R - NH2</text>

  <text x="180" y="226" text-anchor="middle" class="fig-nota" font-size="12">R es el resto de la molecula: puede ser enorme y no importa.</text>
