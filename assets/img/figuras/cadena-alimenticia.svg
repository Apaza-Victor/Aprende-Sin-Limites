<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <text x="180" y="18" text-anchor="middle" class="fig-titulo">Cadena y red alimenticia: la energia se pierde</text>

  <defs>
    <marker id="punta-alimento" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="14" y="150" width="66" height="34" rx="9" class="fig-ok"/>
  <text x="47" y="171" text-anchor="middle" class="fig-ok-txt" font-size="12">Pasto</text>
  <text x="47" y="200" text-anchor="middle" class="fig-nota" font-size="10">productor</text>

  <line x1="80" y1="164" x2="112" y2="164" class="fig-flecha-ok" marker-end="url(#punta-alimento)"/>
  <line x1="80" y1="172" x2="112" y2="212" class="fig-flecha-ok" marker-end="url(#punta-alimento)"/>

  <rect x="112" y="146" width="72" height="34" rx="9" class="fig-apoyo"/>
  <text x="148" y="167" text-anchor="middle" class="fig-apoyo-txt" font-size="12">Conejo</text>
  <rect x="112" y="212" width="72" height="34" rx="9" class="fig-apoyo"/>
  <text x="148" y="233" text-anchor="middle" class="fig-apoyo-txt" font-size="12">Grillo</text>

  <line x1="184" y1="158" x2="216" y2="98" class="fig-flecha-ok" marker-end="url(#punta-alimento)"/>
  <line x1="184" y1="226" x2="216" y2="102" class="fig-flecha-ok" marker-end="url(#punta-alimento)"/>

  <rect x="216" y="78" width="72" height="34" rx="9" class="fig-destac"/>
  <text x="252" y="99" text-anchor="middle" class="fig-destac-txt" font-size="12">Zorro</text>

  <line x1="288" y1="88" x2="316" y2="60" class="fig-flecha-ok" marker-end="url(#punta-alimento)"/>
  <line x1="288" y1="102" x2="316" y2="76" class="fig-flecha-ok" marker-end="url(#punta-alimento)"/>

  <rect x="288" y="40" width="60" height="34" rx="9" class="fig-zona"/>
  <text x="318" y="61" text-anchor="middle" class="fig-nota" font-size="12">Halcon</text>

  <text x="47" y="122" text-anchor="middle" class="fig-ok-txt" font-size="11">1000 J</text>
  <text x="148" y="140" text-anchor="middle" class="fig-apoyo-txt" font-size="11">100 J</text>
  <text x="252" y="72" text-anchor="middle" class="fig-destac-txt" font-size="11">10 J</text>
  <text x="318" y="34" text-anchor="middle" class="fig-nota" font-size="11">1 J</text>

  <line x1="14" y1="254" x2="346" y2="254" class="fig-medida"/>
  <text x="180" y="228" text-anchor="middle" class="fig-nota" font-size="11">La flecha va del que se come al que come: 10 por ciento pasa al siguiente nivel.</text>
</svg>
