  <rect x="256" y="136" width="94" height="32" rx="8" class="fig-mal"/>
  <text x="303" y="157" text-anchor="middle" class="fig-mal-txt" font-size="12">Suelos debiles</text>

  <line x1="110" y1="56" x2="136" y2="94" class="fig-flecha"/>
  <line x1="110" y1="104" x2="136" y2="104" class="fig-flecha"/>
  <line x1="110" y1="152" x2="136" y2="114" class="fig-flecha"/>

  <line x1="228" y1="96" x2="252" y2="56" class="fig-flecha"/>
  <line x1="228" y1="104" x2="252" y2="104" class="fig-flecha"/>
  <line x1="228" y1="112" x2="252" y2="152" class="fig-flecha"/>

  <text x="180" y="204" text-anchor="middle" class="fig-nota" font-size="12">La solucion empieza por reducir la fuente, no por tratar el sintoma.</text>
