<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220">
  <text x="180" y="18" text-anchor="middle" class="fig-titulo">De la fuente de contaminacion al dano</text>

  <defs>
    <marker id="punta-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect x="10" y="40" width="98" height="32" rx="8" class="fig-apoyo"/>
  <text x="59" y="61" text-anchor="middle" class="fig-apoyo-txt" font-size="12">Fabricas</text>

  <rect x="10" y="88" width="98" height="32" rx="8" class="fig-apoyo"/>
  <text x="59" y="109" text-anchor="middle" class="fig-apoyo-txt" font-size="12">Autos</text>

  <rect x="10" y="136" width="98" height="32" rx="8" class="fig-apoyo"/>
  <text x="59" y="157" text-anchor="middle" class="fig-apoyo-txt" font-size="12">Basura</text>

  <rect x="140" y="76" width="86" height="56" rx="10" class="fig-destac"/>
  <text x="183" y="109" text-anchor="middle" class="fig-destac-txt" font-size="13">Ambiente</text>

  <rect x="256" y="40" width="94" height="32" rx="8" class="fig-mal"/>
  <text x="303" y="61" text-anchor="middle" class="fig-mal-txt" font-size="12">Enfermedades</text>

  <rect x="256" y="88" width="94" height="32" rx="8" class="fig-mal"/>
