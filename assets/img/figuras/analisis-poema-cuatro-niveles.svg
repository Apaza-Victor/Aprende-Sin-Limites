<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250">
  <defs>
    <marker id="punta-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <text x="180" y="18" text-anchor="middle" class="fig-titulo">Las cuatro del analisis de un poema</text>

  <rect x="24" y="32" width="312" height="42" rx="9" class="fig-destac"/>
  <text x="40" y="50" class="fig-destac-txt">1. Que dice  (el tema)</text>
  <text x="40" y="67" class="fig-sub">una afirmacion, nunca un sustantivo solo</text>

  <line x1="180" y1="74" x2="180" y2="86" class="fig-flecha"/>

  <rect x="24" y="88" width="312" height="42" rx="9" class="fig-ok"/>
  <text x="40" y="106" class="fig-ok-txt">2. Como lo dice  (la forma)</text>
  <text x="40" y="123" class="fig-sub">metro, rima, estrofas</text>

  <line x1="180" y1="130" x2="180" y2="142" class="fig-flecha"/>

  <rect x="24" y="144" width="312" height="42" rx="9" class="fig-apoyo"/>
  <text x="40" y="162" class="fig-titulo" font-size="13">3. Con que figuras  (los recursos)</text>
  <text x="40" y="179" class="fig-sub">citadas literalmente, con su nombre</text>

  <line x1="180" y1="186" x2="180" y2="198" class="fig-flecha"/>

  <rect x="24" y="200" width="312" height="42" rx="9" class="fig-mal"/>
  <text x="40" y="218" class="fig-mal-txt">4. Para que y que efecto  (la intencion)</text>
  <text x="40" y="235" class="fig-sub">aqui se cierra el analisis</text>
</svg>
