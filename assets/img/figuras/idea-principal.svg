  <rect x="129" y="118" width="102" height="80" rx="9" class="fig-apoyo"/>
  <text x="180" y="140" text-anchor="middle" class="fig-titulo" font-size="12">Dato 2</text>
  <text x="180" y="160" text-anchor="middle" class="fig-nota">la respalda</text>

