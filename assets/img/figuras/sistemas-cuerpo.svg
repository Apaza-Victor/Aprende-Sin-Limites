<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <text x="180" y="18" text-anchor="middle" class="fig-titulo">Los sistemas trabajan juntos: un ejemplo</text>

  <defs>
    <marker id="punta-flujo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="20" y="34" width="80" height="40" rx="9" class="fig-destac"/>
  <text x="60" y="52" text-anchor="middle" class="fig-destac-txt" font-size="12">Respiracion</text>
  <text x="60" y="67" text-anchor="middle" class="fig-nota" font-size="10">toma O2</text>

  <line x1="100" y1="54" x2="140" y2="80" class="fig-flecha-ok" marker-end="url(#punta-flujo)"/>
  <line x1="100" y1="66" x2="140" y2="180" class="fig-flecha-ok" marker-end="url(#punta-flujo)"/>

  <rect x="140" y="52" width="80" height="40" rx="9" class="fig-ok"/>
  <text x="180" y="70" text-anchor="middle" class="fig-ok-txt" font-size="12">Sangre</text>
  <text x="180" y="85" text-anchor="middle" class="fig-nota" font-size="10">transporta</text>

  <line x1="220" y1="60" x2="258" y2="60" class="fig-flecha-ok" marker-end="url(#punta-flujo)"/>
  <line x1="220" y1="84" x2="258" y2="120" class="fig-flecha-ok" marker-end="url(#punta-flujo)"/>

  <rect x="258" y="40" width="84" height="40" rx="9" class="fig-apoyo"/>
  <text x="300" y="58" text-anchor="middle" class="fig-apoyo-txt" font-size="12">Celulas</text>
  <text x="300" y="73" text-anchor="middle" class="fig-nota" font-size="10">usan el O2</text>

  <rect x="258" y="112" width="84" height="40" rx="9" class="fig-apoyo"/>
  <text x="300" y="130" text-anchor="middle" class="fig-apoyo-txt" font-size="12">CO2</text>
  <text x="300" y="145" text-anchor="middle" class="fig-nota" font-size="10">desecho</text>

  <rect x="140" y="164" width="80" height="40" rx="9" class="fig-zona"/>
  <text x="180" y="182" text-anchor="middle" class="fig-nota" font-size="12">Nervioso</text>
  <text x="180" y="197" text-anchor="middle" class="fig-nota" font-size="10">avisa y regula</text>

  <line x1="180" y1="164" x2="180" y2="128" class="fig-flecha-ok" marker-end="url(#punta-flujo)"/>
  <line x1="180" y1="164" x2="96" y2="120" class="fig-flecha-ok" marker-end="url(#punta-flujo)"/>

  <rect x="20" y="100" width="80" height="40" rx="9" class="fig-apoyo"/>
  <text x="60" y="118" text-anchor="middle" class="fig-apoyo-txt" font-size="12">Corazon</text>
  <text x="60" y="133" text-anchor="middle" class="fig-nota" font-size="10">bombea</text>

  <text x="180" y="236" text-anchor="middle" class="fig-nota" font-size="11">La respiracion entrega oxigeno, la sangre lo reparte y</text>
  <text x="180" y="250" text-anchor="middle" class="fig-nota" font-size="11">el sistema nervioso ajusta el ritmo segun la necesidad.</text>
  <text x="180" y="268" text-anchor="middle" class="fig-nota" font-size="11">Un fallo en un sistema se nota en los demas: por eso hay homeostasis.</text>
</svg>
