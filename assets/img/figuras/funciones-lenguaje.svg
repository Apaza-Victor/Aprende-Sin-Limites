<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250">
  <defs>
    <marker id="punta-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <text x="180" y="18" text-anchor="middle" class="fig-titulo">Quien manda en el texto</text>

  <rect x="96" y="32" width="168" height="40" rx="9" class="fig-zona"/>
  <text x="180" y="57" text-anchor="middle" class="fig-titulo" font-size="13">Un texto de la vida real</text>

  <line x1="180" y1="72" x2="180" y2="90" class="fig-flecha"/>
  <text x="192" y="86" class="fig-nota">se reparte entre</text>

  <rect x="14" y="96" width="150" height="66" rx="9" class="fig-ok"/>
  <text x="89" y="118" text-anchor="middle" class="fig-ok-txt" font-size="13">Emotiva</text>
  <text x="89" y="136" text-anchor="middle" class="fig-sub">manda el emisor</text>
  <text x="26" y="154" class="fig-nota" font-size="11.5">yo, adjectives, !</text>

  <rect x="196" y="96" width="150" height="66" rx="9" class="fig-destac"/>
  <text x="271" y="118" text-anchor="middle" class="fig-destac-txt" font-size="13">Referencial</text>
  <text x="271" y="136" text-anchor="middle" class="fig-sub">manda el dato</text>
  <text x="208" y="154" class="fig-nota" font-size="11.5">cifras, fechas, sustantivos</text>

  <rect x="14" y="174" width="150" height="66" rx="9" class="fig-mal"/>
  <text x="89" y="196" text-anchor="middle" class="fig-mal-txt" font-size="13">Conativa</text>
  <text x="89" y="214" text-anchor="middle" class="fig-sub">manda el receptor</text>
  <text x="26" y="232" class="fig-nota" font-size="11.5">imperativo, usted, ?</text>

  <rect x="196" y="174" width="150" height="66" rx="9" class="fig-apoyo"/>
  <text x="271" y="196" text-anchor="middle" class="fig-titulo" font-size="12.5">Fatica y metalinguistica</text>
  <text x="271" y="214" text-anchor="middle" class="fig-sub">el canal y el diccionario</text>
  <text x="208" y="232" class="fig-nota" font-size="11.5">hola, adios, que es...</text>
</svg>
