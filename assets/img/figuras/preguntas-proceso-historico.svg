<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270">
  <text x="180" y="18" text-anchor="middle" class="fig-titulo">Las cuatro preguntas del proceso historico</text>

  <defs>
    <marker id="punta-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect x="16" y="32" width="328" height="40" rx="10" class="fig-zona"/>
  <text x="180" y="51" text-anchor="middle" class="fig-titulo" font-size="13">1. Que cambio?</text>
  <text x="180" y="67" text-anchor="middle" class="fig-nota" font-size="12">un hecho concreto, con fecha y lugar</text>

  <line x1="180" y1="74" x2="180" y2="86" class="fig-flecha"/>

  <rect x="16" y="90" width="328" height="40" rx="10" class="fig-zona"/>
  <text x="180" y="109" text-anchor="middle" class="fig-titulo" font-size="13">2. Por que ocurrio?</text>
  <text x="180" y="125" text-anchor="middle" class="fig-nota" font-size="12">causa estructural, conjuntural o individual</text>

  <line x1="180" y1="132" x2="180" y2="144" class="fig-flecha"/>

  <rect x="16" y="148" width="328" height="40" rx="10" class="fig-zona"/>
  <text x="180" y="167" text-anchor="middle" class="fig-titulo" font-size="13">3. En que orden?</text>
  <text x="180" y="183" text-anchor="middle" class="fig-nota" font-size="12">antes y despues: la periodizacion</text>

  <line x1="180" y1="190" x2="180" y2="202" class="fig-flecha"/>

  <rect x="16" y="206" width="328" height="40" rx="10" class="fig-ok"/>
  <text x="180" y="225" text-anchor="middle" class="fig-ok-txt" font-size="13">4. Para que sirvio?</text>
  <text x="180" y="241" text-anchor="middle" class="fig-apoyo-txt" font-size="12">consecuencias intendedas y no previstas</text>

  <text x="180" y="262" text-anchor="middle" class="fig-nota" font-size="12">Si no respondes las cuatro, tienes una anecdota, no un analisis.</text>
</svg>
