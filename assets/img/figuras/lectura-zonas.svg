<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <defs>
    <marker id="punta-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <text x="180" y="18" text-anchor="middle" class="fig-titulo">Zonas de un texto segun su rendimiento</text>

  <rect x="70" y="32" width="220" height="34" rx="8" class="fig-destac"/>
  <text x="86" y="54" class="fig-destac-txt">Titulo y subtitulos</text>
  <text x="272" y="54" class="fig-destac-txt" font-size="12" text-anchor="end">se leen siempre</text>

  <rect x="70" y="74" width="220" height="34" rx="8" class="fig-ok"/>
  <text x="86" y="96" class="fig-ok-txt">Primer y ultimo parrafo</text>
  <text x="272" y="96" class="fig-ok-txt" font-size="12" text-anchor="end">30 segundos</text>

  <rect x="70" y="116" width="220" height="34" rx="8" class="fig-apoyo"/>
  <text x="86" y="138" class="fig-titulo" font-size="13">Parrafos centrales</text>
  <text x="272" y="138" class="fig-apoyo-txt" font-size="12">con detalle si se pide</text>

  <rect x="70" y="158" width="220" height="34" rx="8" class="fig-mal"/>
  <text x="86" y="180" class="fig-mal-txt">Ejemplos y listas</text>
  <text x="272" y="180" class="fig-mal-txt" font-size="12" text-anchor="end">se saltan</text>

  <line x1="52" y1="49" x2="52" y2="175" class="fig-medida"/>
  <text x="46" y="116" class="fig-nota" text-anchor="end" font-size="12">rendimiento</text>

  <rect x="20" y="206" width="320" height="42" rx="9" class="fig-zona"/>
  <text x="36" y="224" class="fig-sub">La tecnica principal es decidir que leer antes de leer.</text>
  <text x="36" y="242" class="fig-nota">Un buen lector pierde tiempo a proposito en la zona equivocada.</text>
</svg>
