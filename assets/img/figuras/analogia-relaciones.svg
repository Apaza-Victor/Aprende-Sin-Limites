<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <defs>
    <marker id="punta-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <marker id="punta-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="180" y="18" text-anchor="middle" class="fig-titulo">La misma relacion en los dos pares</text>

  <text x="34" y="46" class="fig-sub">Par dado</text>
  <rect x="18" y="56" width="84" height="40" rx="9" class="fig-ok"/>
  <text x="60" y="81" text-anchor="middle" class="fig-ok-txt">A</text>
  <text x="120" y="82" text-anchor="middle" class="fig-apoyo-txt">es a</text>
  <rect x="140" y="56" width="84" height="40" rx="9" class="fig-ok"/>
  <text x="182" y="81" text-anchor="middle" class="fig-ok-txt">B</text>
  <text x="238" y="82" class="fig-nota">relacion: R</text>

  <line x1="34" y1="112" x2="34" y2="128" class="fig-flecha-ok"/>
  <text x="46" y="126" class="fig-ok-txt" font-size="12">se copia tal cual</text>

  <text x="34" y="152" class="fig-sub">Par por completar</text>
  <rect x="18" y="162" width="84" height="40" rx="9" class="fig-ok"/>
  <text x="60" y="187" text-anchor="middle" class="fig-ok-txt">C</text>
  <text x="120" y="188" text-anchor="middle" class="fig-apoyo-txt">es a</text>
  <rect x="140" y="162" width="84" height="40" rx="9" class="fig-destac"/>
  <text x="182" y="187" text-anchor="middle" class="fig-destac-txt">x</text>

  <line x1="238" y1="182" x2="238" y2="182" class="fig-flecha"/>
  <rect x="252" y="120" width="92" height="122" rx="9" class="fig-zona"/>
  <text x="298" y="140" text-anchor="middle" class="fig-sub">Filtro rapido</text>
  <text x="262" y="162" class="fig-nota">x debe ser de</text>
  <text x="262" y="180" class="fig-nota">la misma clase</text>
  <text x="262" y="198" class="fig-nota">que A.</text>
  <text x="262" y="222" class="fig-mal-txt" font-size="12">Si no, se</text>
  <text x="262" y="238" class="fig-mal-txt" font-size="12">descarta.</text>
</svg>
