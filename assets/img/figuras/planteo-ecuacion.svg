<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <text x="180" y="18" text-anchor="middle" class="fig-titulo">Del enunciado a la ecuacion, paso a paso</text>

  <defs>
    <marker id="punta-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect x="40" y="32" width="280" height="40" rx="10" class="fig-apoyo"/>
  <text x="180" y="49" text-anchor="middle" class="fig-titulo" font-size="13">1. Problema en palabras</text>
  <text x="180" y="65" text-anchor="middle" class="fig-apoyo-txt" font-size="12">"Compro 3 cuadernos y me sobran 5 pesos de 20"</text>

  <line x1="180" y1="74" x2="180" y2="88" class="fig-flecha"/>

  <rect x="40" y="92" width="280" height="40" rx="10" class="fig-zona"/>
  <text x="180" y="109" text-anchor="middle" class="fig-titulo" font-size="13">2. Variable</text>
  <text x="180" y="125" text-anchor="middle" class="fig-apoyo-txt" font-size="12">x = precio de un cuaderno</text>

  <line x1="180" y1="134" x2="180" y2="148" class="fig-flecha"/>

  <rect x="40" y="152" width="280" height="40" rx="10" class="fig-destac"/>
  <text x="180" y="169" text-anchor="middle" class="fig-destac-txt" font-size="13">3. Ecuacion</text>
  <text x="180" y="185" text-anchor="middle" class="fig-destac-txt" font-size="12">3x + 5 = 20</text>

  <line x1="180" y1="194" x2="180" y2="208" class="fig-flecha"/>

  <rect x="40" y="212" width="280" height="40" rx="10" class="fig-ok"/>
  <text x="180" y="229" text-anchor="middle" class="fig-ok-txt" font-size="13">4. Respuesta con unidades</text>
  <text x="180" y="245" text-anchor="middle" class="fig-ok-txt" font-size="12">x = 5 pesos</text>

  <text x="180" y="272" text-anchor="middle" class="fig-nota" font-size="12">Si el enunciado pide el total, no despejes x: despeja lo que preguntan.</text>
</svg>
