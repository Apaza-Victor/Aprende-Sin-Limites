    <path d="M16 34 L28 16 L40 34" fill="none" stroke="#0b1020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="20" y1="42" x2="36" y2="42" stroke="#0b1020" stroke-width="5" stroke-linecap="round"/>
    <text x="76" y="26" font-family="Poppins, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700" fill="#9aa6c3" letter-spacing="3">SITIO EDUCATIVO</text>
    <text x="76" y="60" font-family="Poppins, Segoe UI, system-ui, sans-serif" font-size="34" font-weight="800" fill="#e8ecf7">HTML · CSS · JavaScript</text>
