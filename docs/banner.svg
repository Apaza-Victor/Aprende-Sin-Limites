  <g font-family="Poppins, Segoe UI, system-ui, sans-serif">
    <g transform="translate(64 240)">
      <text x="0" y="26" font-size="30" font-weight="700" fill="#3b82f6">11</text>
      <text x="42" y="26" font-size="15" fill="#9aa6c3">cursos</text>
    </g>
    <g transform="translate(168 240)">
