<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="%%DESCRIPCION%%" />
  %%SCRIPT_TEMA%%
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

</head>
<body data-curso="%%SLUG%%">

  <nav class="navbar navbar-expand-lg nav-guia sticky-top">
    <div class="container">
      <a class="navbar-brand marca d-flex align-items-center gap-2" href="%%REL%%/index.html">
        <i class="bi bi-stars"></i> Aprende Sin Límites
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMod"
        aria-controls="navMod" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMod">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item"><a class="nav-link active" href="%%REL%%/secciones/cursos.html">Cursos</a></li>
          <li class="nav-item"><a class="nav-link" href="%%REL%%/secciones/metodo.html">Método</a></li>
          <li class="nav-item"><a class="nav-link" href="%%REL%%/secciones/tablas.html">Tablas</a></li>
          <li class="nav-item"><a class="nav-link" href="%%REL%%/secciones/calculadora.html">Calculadora</a></li>
          <li class="nav-item"><a class="nav-link" href="%%REL%%/secciones/recursos.html">Recursos</a></li>
          <li class="nav-item"><a class="nav-link" href="%%REL%%/secciones/faq.html">Preguntas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <section class="seccion">
      <div class="container">
        <nav class="miga mb-3" aria-label="breadcrumb">
          <a href="%%REL%%/secciones/cursos.html"><i class="bi bi-collection"></i> Cursos</a>
          <span class="mx-2 opacity-50">/</span>
          <a href="../index.html">%%CURSO%%</a>
          <span class="mx-2 opacity-50">/</span>
          <span>%%TITULO%%</span>
        </nav>

        <div class="titulo-curso mb-4 d-flex align-items-center gap-3">
          <div class="icono"><i class="bi bi-%%ICONO_MOD%%"></i></div>
          <div>
            <h1 class="mb-0">%%TITULO%%</h1>
            <p class="col-mut mb-0">%%LECCIONES%% lecciones</p>
          </div>
        </div>

        <div class="tarjeta p-4 reveal">
          <div class="d-flex align-items-center gap-3 mb-3">
            <div><i class="bi bi-check2-circle" style="color: var(--acento);"></i></div>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between small">
                <span class="col-mut">Lecciones completadas</span>
                <span id="contadorLecciones" class="fw-semibold">0 / %%LECCIONES%%</span>
              </div>
              <div class="progress" style="height: 6px; margin-top: .35rem;">
                <div id="barraProgreso" class="progress-bar" style="width: 0%;" role="progressbar"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4 mt-4">
          <div class="col-lg-8">
            <h4 class="d-flex align-items-center gap-2 mb-3"><i class="bi bi-journal-text" style="color: var(--acento);"></i> Lecciones del módulo</h4>
            <div class="row g-3" id="gridLecciones">
              %%LISTA_LECCIONES%%
            </div>
          </div>
          <div class="col-lg-4">
            <div class="tarjeta p-4 reveal">
              <h5 class="d-flex align-items-center gap-2"><i class="bi bi-signpost-2" style="color: var(--acento);"></i> Ruta del curso</h5>
              <div class="ruta mt-3">
                %%RUTA%%
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  %%FOOTER%%

  <!-- si el JS no corre, .reveal no debe quedarse invisible -->
  <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="%%REL%%/assets/js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var CLAVES = %%CLAVES%%;
      var claveModulo = "%%CLAVE_MODULO%%";
      var KEY = "asl-progreso";
      function leer() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
      function pintar() {
        var estados = leer(), hechas = 0;
        CLAVES.forEach(function (k) { if (estados[k]) hechas++; });
        var contador = document.getElementById("contadorLecciones");
        if (contador) contador.textContent = hechas + " / " + CLAVES.length;
        var barra = document.getElementById("barraProgreso");
        if (barra && CLAVES.length) barra.style.width = Math.round((hechas / CLAVES.length) * 100) + "%";
        var checks = document.querySelectorAll(".checkbox-leccion[data-clave]");
        checks.forEach(function (c) {
          c.checked = !!estados[c.getAttribute("data-clave")];
          var card = c.closest(".lecc-card");
          if (card) card.classList.toggle("hecha", c.checked);
        });
      }
      pintar();
      document.addEventListener("change", function (e) {
        var c = e.target;
        if (c && c.classList && c.classList.contains("checkbox-leccion") && c.hasAttribute("data-clave")) {
          var estados = leer();
          if (c.checked) estados[c.getAttribute("data-clave")] = true; else delete estados[c.getAttribute("data-clave")];
          localStorage.setItem(KEY, JSON.stringify(estados));
          pintar();
        }
      });
      document.getElementById("anioAuto").textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
